name: Android RATV Release
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Release Demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.STOKEN }}

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle and wrapper
        uses: actions/cache@v2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant Permission for Gradlew to Execute
        run: chmod +x gradlew

      - name: Build Demo APK ⚙️🛠
        run: bash ./gradlew assembleDemoRelease
      - name: Build Demo AAB ⚙️🛠
        run: bash ./gradlew bundleDemoRelease
      - name: Build Free APK ⚙️🛠
        run: bash ./gradlew assembleFreeRelease
      - name: Build Free AAB ⚙️🛠
        run: bash ./gradlew bundleFreeRelease

      - name: Create Release ✅
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.STOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: false
          prerelease: true

      - name: Upload Action Application APK File 🗳
        uses: actions/upload-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.STOKEN }}
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/demo/release/*.apk
            app/build/outputs/bundle/demoRelease/*.aab
            app/build/outputs/apk/free/release/*.apk
            app/build/outputs/bundle/freeRelease/*.aab
          if-no-files-found: ignore
      - name: Upload Application APK Release File 🗳
        env:
          GITHUB_TOKEN: ${{ secrets.STOKEN }}
        run: |
          gh release upload ${{github.ref}} app/build/outputs/apk/demo/release/*.apk
          gh release upload ${{github.ref}} app/build/outputs/bundle/demoRelease/*.aab
          gh release upload ${{github.ref}} app/build/outputs/apk/free/release/*.apk
          gh release upload ${{github.ref}} app/build/outputs/bundle/freeRelease/*.aab